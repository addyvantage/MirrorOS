[project]
name = "mirroros-api"
version = "0.1.0"
description = "MirrorOS API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.0",
  "alembic>=1.13.0",
  "pydantic-settings>=2.3.0",
]

[tool.uv]
package = false

[tool.alembic]
script_location = "app/migrations"
prepend_sys_path = ".:../.."
